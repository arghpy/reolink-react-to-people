logLevel: error

moq: no # For TLS warnings

webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts:
  - <MACHINE_IP>   # your host machine's LAN IP

pathDefaults:
    sourceOnDemand: no

paths:
  camera_web:
    source: "rtsp://<user>:<pass>@camera:554/Preview_01_main"

  camera-front:
    source: "rtsp://<user>:<pass>@camera-front:554/Preview_01_sub"
    runOnInit: sh -c 'mkdir -p "$(date "+/recordings/%Y/%m/%d/%H/captures")"'
    runOnAvailableRestart: yes
    runOnAvailable: >
      ffmpeg
      -loglevel warning
      -fflags +genpts+discardcorrupt
      -rtsp_transport tcp
      -analyzeduration 10000000
      -probesize 50000000
      -i rtsp://localhost:$RTSP_PORT/$MTX_PATH
      -c:v copy -c:a copy
      -f segment
      -segment_format matroska
      -segment_time 3600
      -segment_atclocktime 1
      -break_non_keyframes 1
      -reset_timestamps 1
      -avoid_negative_ts make_zero
      -strftime 1
      "/recordings/%Y/%m/%d/%H/${MTX_PATH}_%M:%S.mkv"
